<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACHDGF Member State Validation Dashboard</title>
<meta name="description" content="Africa CDC — African Continental Health Data Governance Framework: Member State Validation Dashboard (REDCap CSV import).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='11' fill='%238C0024'/%3E%3Crect y='11' width='32' height='10' fill='%23C3A466'/%3E%3Crect y='21' width='32' height='11' fill='%2300764B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#8C0024; --maroon-d:#6B001B; --gold:#C3A466; --gold-d:#8F7338; --green:#00764B; --green-d:#005A38;
  --ink:#201A1C; --muted:#665C61; --line:#E8E1DB; --bg:#F7F4F0; --card:#fff;
  --v:var(--green); --a:var(--gold); --n:var(--maroon);
  --v-t:#E3F1EB; --a-t:#F6F0E2; --n-t:#F6E6EA; --m-t:#EFEBE8;
  --radius:12px; --shadow:0 1px 2px rgba(32,26,28,.06),0 4px 14px rgba(32,26,28,.05);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;min-height:100%}
body{margin:0;width:100%;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.hdr{background:linear-gradient(135deg,var(--maroon) 0%,var(--maroon-d) 100%);color:#fff;position:relative}
.hdr::after{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--maroon) 0 33.3%,var(--gold) 33.3% 66.6%,var(--green) 66.6% 100%)}
.hdr-in{max-width:2400px;width:100%;margin:0 auto;padding:18px clamp(16px,2.5vw,48px);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo-tile{background:#fff;border-radius:10px;padding:0 6px;display:flex;align-items:center;justify-content:center;min-width:150px;height:84px;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden}
.logo-tile img{height:80px;width:auto;display:block}
.logo-fallback{display:none;font-weight:800;color:var(--maroon);letter-spacing:.02em;font-size:15px;line-height:1.1;text-align:center}
.logo-tile.nologo img{display:none}
.logo-tile.nologo .logo-fallback{display:block}
.ttl{flex:1 1 380px;min-width:260px;text-align:center;color:#fff}
.ttl .kicker{font-size:clamp(20px,2.6vw,34px);font-weight:800;color:#fff;line-height:1.2;text-align:center}
.ttl h1{margin:6px 0 0;font-size:clamp(20px,2vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.01em;color:#fff}
.ttl .sub{font-size:13px;opacity:.9;font-weight:500}
.hdr-actions{min-width:150px;justify-content:flex-end;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.chip.live .dot{background:#4ADE9B}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--gold);color:#201A1C;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:#D1B57B;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn.sec{background:#fff;color:var(--maroon);border:1px solid var(--line)}
.btn.sec:hover{background:#FBF7F5}
.btn.green{background:var(--green);color:#fff}
.btn.green:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--maroon);border:1px solid var(--maroon)}
.btn.danger{background:var(--maroon);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}

.banner{background:var(--a-t);border-bottom:1px solid #E6D9B8;color:#4A3B14}
.banner-in{max-width:2400px;width:100%;margin:0 auto;padding:9px clamp(16px,2.5vw,48px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner b{color:var(--maroon)}

/* ---------- nav ---------- */
.nav{position:-webkit-sticky;position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(32,26,28,.04)}
.nav-in{max-width:2400px;width:100%;margin:0 auto;padding:0 clamp(16px,2.5vw,48px);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:14px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--maroon)}
.tab[aria-selected=true]{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:700}
.tab .cnt{background:var(--m-t);color:var(--muted);border-radius:999px;padding:0 8px;font-size:11px;font-weight:700}
.tab[aria-selected=true] .cnt{background:var(--n-t);color:var(--maroon)}

main{max-width:2400px;width:100%;margin:0 auto;padding:22px clamp(16px,2.5vw,48px) 60px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--maroon)}
.seg button[aria-pressed=true]{background:var(--maroon);color:#fff}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:16px;margin-bottom:16px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.g-21{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media(max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g-12,.g-21{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.g5{grid-template-columns:minmax(0,1fr)}main{padding:16px 14px 50px}.hdr-in{padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h2{margin:0 0 2px;font-size:15px;font-weight:800;letter-spacing:-.005em}
.card .desc{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.q{display:inline-block;background:var(--m-t);color:var(--muted);font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}

.kpi{position:relative;overflow:hidden;padding-top:20px}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c,var(--maroon))}
.kpi .k-l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .k-v{font-size:38px;font-weight:800;line-height:1.1;margin:6px 0 2px;color:var(--c,var(--maroon));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-v small{font-size:16px;font-weight:700;color:var(--muted)}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi .meter{height:6px;border-radius:99px;background:var(--m-t);margin-top:10px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--c,var(--maroon));border-radius:99px;transform-origin:left;animation:grow .7s ease-out}

/* ---------- bars ---------- */
@keyframes grow{from{transform:scaleX(0)}}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--m-t)}
.stack>span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;min-width:0;white-space:nowrap;overflow:hidden;transform-origin:left;animation:grow .7s ease-out}
.stack>.s-v{background:var(--v)}.stack>.s-a{background:var(--a);color:#201A1C}.stack>.s-n{background:var(--n)}
.stack.thin{height:12px;border-radius:5px}
.stack.thin>span{font-size:0}
.sec-row{margin-bottom:14px}
.sec-row .sr-h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:5px;gap:10px}
.sec-row .sr-h span:last-child{color:var(--muted);font-weight:600;font-size:12.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg-v{background:var(--v)}.lg-a{background:var(--a)}.lg-n{background:var(--n)}.lg-m{background:repeating-linear-gradient(45deg,#CFC8C3 0 3px,#EFEBE8 3px 6px)}

.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:200px;height:200px;flex:0 0 auto}
.donut svg{display:block;width:100%;height:100%}
.donut circle.seg-c{transition:stroke-width .15s,opacity .15s;cursor:pointer}
.donut circle.seg-c:hover{stroke-width:34}
.donut .mid{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut .mid b{font-size:30px;font-weight:800;color:var(--green);letter-spacing:-.02em;line-height:1}
.donut .mid span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;max-width:110px}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:10px;min-width:190px}
.dl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}
.dl i{width:14px;height:14px;border-radius:4px}
.dl .nm{font-weight:600}
.dl .vl{font-weight:800;font-variant-numeric:tabular-nums}
.dl .ct{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.note{font-size:12px;color:var(--muted);background:var(--m-t);border-radius:8px;padding:8px 10px;margin-top:12px}

/* scorecard / ranked */
.sc-row{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(90px,1.6fr) 56px 140px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.sc-row:hover{background:#FBF8F5}
.sc-code{font-weight:800;color:var(--maroon);font-size:12.5px}
.sc-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-track{position:relative;height:14px;background:var(--m-t);border-radius:7px}
.sc-fill{height:100%;border-radius:7px;transform-origin:left;animation:grow .7s ease-out}
.sc-track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.sc-val{font-weight:800;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.f-high{background:var(--v)}.f-mid{background:var(--a)}.f-low{background:var(--n)}.f-na{background:#B7AFAA}
.scale-l{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(90px,1.6fr) 56px 140px;gap:10px;padding:0 8px 4px;font-size:10.5px;color:var(--muted);font-weight:700}
.scale-l .tr{position:relative;height:14px}
.scale-l .tr span{position:absolute;transform:translateX(-50%);top:0}
.badge{display:inline-block;text-align:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-high{background:var(--v);color:#fff}.b-mid{background:var(--a);color:#201A1C}.b-low{background:var(--n);color:#fff}.b-na{background:var(--m-t);color:var(--muted)}
.b-dv{background:var(--v-t);color:var(--green-d)}.b-da{background:var(--a-t);color:#6B521A}.b-dn{background:var(--n-t);color:var(--maroon)}
.rank-row{display:grid;grid-template-columns:22px 34px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.rank-row:hover{background:#FBF8F5}
.rank-row .pos{color:var(--muted);font-weight:700;font-size:12px}
.rank-row .rb{height:10px;background:var(--m-t);border-radius:5px;overflow:hidden}
.rank-row .rb i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow .7s ease-out}
.rank-row .rv{text-align:right;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.rank-row .rv small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
.rank-t{display:block;font-size:12px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* scatter */
.scatter{width:100%;height:auto;display:block}
.scatter text{font-family:inherit}
.scatter .pt{cursor:pointer;transition:r .12s}
.scatter .pt:hover{stroke:#201A1C;stroke-width:2}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.t th{position:-webkit-sticky;position:sticky;top:0;background:#FAF6F2;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
.t th.sortable{cursor:pointer;user-select:none}
.t th.sortable:hover{color:var(--maroon)}
.t th .ar{color:var(--maroon)}
.t td{padding:9px 12px;border-bottom:1px solid #F1ECE7;vertical-align:middle}
.t tr.row-i{cursor:pointer}
.t tr.row-i:hover td{background:#FCFAF8}
.t tr.sub td{background:#FAF6F2;font-weight:800;color:var(--maroon);font-size:12px;letter-spacing:.03em}
.t tr.tot td{background:var(--maroon);color:#fff;font-weight:800}
.t tr.tot td .stack{background:rgba(255,255,255,.25)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{color:var(--muted);font-weight:500;margin-left:4px}
.tot .num small{color:#F0DCA8}
.t td .pc-v{color:var(--green-d);font-weight:700}.t td .pc-a{color:#7A5F22;font-weight:700}.t td .pc-n{color:var(--maroon);font-weight:700}
.codepill{display:inline-block;min-width:30px;text-align:center;font-weight:800;color:var(--maroon);background:var(--n-t);border-radius:6px;padding:1px 7px;font-size:12px}

/* heatmap */
.hm{border-collapse:separate;border-spacing:3px;font-size:12px}
.hm th{position:sticky;top:0;background:#fff;z-index:3;font-size:11px;padding:6px 2px;text-align:center;font-weight:800;color:var(--maroon)}
.hm th.stn,.hm td.stn{position:sticky;left:0;background:#fff;z-index:4;text-align:left;min-width:190px;max-width:220px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm th.stn{z-index:5}
.hm td.stn button{border:0;background:none;padding:3px 0;font-weight:600;text-align:left;width:100%;overflow:hidden;text-overflow:ellipsis}
.hm td.stn button:hover{color:var(--maroon);text-decoration:underline}
.hm .cell{width:34px;height:30px;border-radius:6px;border:0;font-weight:800;font-size:13px;transition:transform .1s,box-shadow .1s}
.hm .cell:hover{transform:scale(1.14);box-shadow:0 3px 10px rgba(0,0,0,.25);position:relative;z-index:6}
.c-V{background:var(--v);color:#fff}.c-A{background:var(--a);color:#201A1C}.c-N{background:var(--n);color:#fff}
.c-M{background:repeating-linear-gradient(45deg,#D8D1CC 0 3px,#EFEBE8 3px 6px);color:#7A7075}
.hm td.sum{font-size:11px;color:var(--muted);white-space:nowrap;padding:0 6px}
.hm-wrap{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;min-width:220px;font-size:13px}
select.search{min-width:150px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
button.pill:hover{border-color:var(--maroon);color:var(--maroon)}
.pill.v{background:var(--v-t);border-color:#BFDCCF;color:var(--green-d)}
.pill.a{background:var(--a-t);border-color:#E6D9B8;color:#6B521A}
.pill.n{background:var(--n-t);border-color:#E7BFC9;color:var(--maroon)}
.pill.m{background:var(--m-t);color:var(--muted)}

/* comments */
.cm{border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;background:#fff;margin-bottom:10px}
.cm.n{border-left-color:var(--maroon)}
.cm-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.cm-h b{font-weight:700}
.cm p{margin:0;white-space:pre-wrap}
.cm .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:11px;font-weight:700;background:var(--m-t);color:var(--muted);border-radius:5px;padding:1px 7px}
.theme-row{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.theme-row:hover,.theme-row[aria-pressed=true]{background:#FBF1F3}
.theme-row .tb{height:12px;background:var(--m-t);border-radius:6px;overflow:hidden}
.theme-row .tb i{display:block;height:100%;background:var(--maroon);border-radius:6px;transform-origin:left;animation:grow .7s ease-out}
.theme-row b{text-align:right;font-variant-numeric:tabular-nums}

/* register */
.reg-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-size:12.5px}
.reg-in:focus{border-color:var(--maroon);outline:none;box-shadow:0 0 0 3px rgba(140,0,36,.12)}
details.dt summary{cursor:pointer;color:var(--maroon);font-weight:700;font-size:12px}
details.dt .dt-b{margin-top:6px;font-size:12.5px;display:grid;gap:6px;max-width:460px}
details.dt .dt-b div{background:var(--m-t);border-radius:7px;padding:6px 9px}
td.reg-st select{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;width:100%}

/* drawer */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(32,26,28,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:70;transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{background:var(--maroon);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:flex-start;border-bottom:5px solid var(--gold)}
.dr-h h3{margin:0;font-size:18px;font-weight:800;line-height:1.25}
.dr-h .x{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;width:34px;height:34px;font-size:18px;flex:0 0 auto}
.dr-h .x:hover{background:rgba(255,255,255,.3)}
.dr-b{padding:18px 20px 30px;overflow:auto;flex:1}
.dr-b h4{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mini-k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mini-k div{background:var(--m-t);border-radius:9px;padding:8px 10px;text-align:center}
.mini-k b{display:block;font-size:20px;font-weight:800}
.mini-k span{font-size:11px;color:var(--muted);font-weight:600}
.mini-k .v b{color:var(--green)}.mini-k .a b{color:var(--gold-d)}.mini-k .n b{color:var(--maroon)}

/* drop zone */
.drop{border:2px dashed #D4C9C0;border-radius:14px;padding:30px 20px;text-align:center;background:#FFFCFA;transition:all .15s}
.drop.on{border-color:var(--maroon);background:var(--n-t)}
.drop h3{margin:6px 0;font-size:16px;font-weight:800}
.drop p{margin:0 0 14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:600}
.fld{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fld input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:110px;font-weight:600;color:var(--ink)}
.ok{color:var(--green);font-weight:800}.bad{color:var(--maroon);font-weight:800}
.meth li{margin-bottom:6px}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--m-t);padding:1px 5px;border-radius:4px}

/* toast + dialog + tooltip */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(560px,92vw)}
.toast{background:#201A1C;color:#fff;border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600;border-left:5px solid var(--green);animation:rise .25s}
.toast.warn{border-left-color:var(--gold)}.toast.error{border-left-color:#FF6B8A}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
dialog{border:0;border-radius:14px;padding:22px;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(32,26,28,.5)}
dialog h3{margin:0 0 8px}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#tip{position:fixed;z-index:100;background:#201A1C;color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:7px;pointer-events:none;white-space:pre-line;max-width:300px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
.empty{padding:34px;text-align:center;color:var(--muted)}
.foot{max-width:2400px;width:100%;margin:0 auto;padding:0 clamp(16px,2.5vw,48px) 40px;color:var(--muted);font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.nav,.hdr-actions,.banner,.toolbar,.btn,#toasts{display:none!important}body{background:#fff}.card{box-shadow:none}.drawer,.ov{display:none}}
</style>

/* =====================================================================
   3. CSV parsing + REDCap mapping
   ===================================================================== */
function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r\n|\n|\r/,1)[0] || '';
  const delim = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === delim){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

function normStatus(v){
  const s = norm(v);
  if (!s) return null;
  if (s === '1' || s === 'validated' || s === 'valide') return 'V';
  if (s === '2' || s.startsWith('validated with') || s.startsWith('valide avec')) return 'A';
  if (s === '3' || s === 'not validated' || s === 'non valide') return 'N';
  return 'X';
}
function resolveState(raw){
  raw = String(raw ?? '').trim();
  if (!raw) return { name:null };
  if (/^\d+$/.test(raw)){ const k = +raw; return (k >= 1 && k <= 55) ? { name:STATES[k-1] } : { name:raw, unknown:true }; }
  const m = STATE_BY_NORM.get(norm(raw));
  return m ? { name:m } : { name:raw, unknown:true };
}
const parseTs = s => { const t = Date.parse(String(s||'').replace(' ','T')); return isNaN(t) ? -1 : t; };

function buildRecords(rows){
  if (rows.length < 2) throw new Error('The file has no data rows. Export "All data" from REDCap (raw values or labels) as CSV and try again.');
  const header = rows[0].map(h => String(h).trim());
  const idx = {}; header.forEach((h,i) => { idx[h.toLowerCase()] = i; });
  const col = n => idx[n.toLowerCase()];
  const statusCols = ITEMS.filter(it => col(it.col+'_status') !== undefined);
  if (!statusCols.length){
    throw new Error('No validation columns found (expected p1_status … c5_status). Please export the REDCap project "achdgf_member_state_validation" as CSV.');
  }
  const completeCol = header.findIndex(h => /_complete$/i.test(h));
  const tsCol = header.findIndex(h => /_timestamp$/i.test(h));
  const rep = { rowsRead:0, noState:0, unknownStates:[], badValues:0, dupes:[], itemsMapped:statusCols.length,
                itemsMissingCols: ITEMS.filter(it => col(it.col+'_status') === undefined).map(i=>i.code),
                cols:{ id:col('record_id'), state:col('member_state'), delegation:col('delegation'), date:col('workshop_date'),
                       obs:col('overall_observations'), rat:col('country_rationale'), complete:completeCol, ts:tsCol },
                headerSet:new Set(header.map(h=>h.toLowerCase())) };
  const get = (r,i) => (i === undefined || i < 0) ? '' : String(r[i] ?? '').trim();
  const all = [];
  rows.slice(1).forEach((r, ri) => {
    rep.rowsRead++;
    const st = resolveState(get(r, col('member_state')));
    if (!st.name){ rep.noState++; return; }
    if (st.unknown && !rep.unknownStates.includes(st.name)) rep.unknownStates.push(st.name);
    const dec = {}, am = {};
    ITEMS.forEach(it => {
      const v = normStatus(get(r, col(it.col+'_status')));
      if (v === 'X'){ rep.badValues++; dec[it.code] = null; } else dec[it.code] = v;
      const a = get(r, col(it.col+'_amend'));
      if (a) am[it.code] = a;
    });
    const cmp = get(r, completeCol);
    all.push({
      id: get(r, col('record_id')) || String(ri+1), row: ri, state: st.name,
      delegation: get(r, col('delegation')), date: get(r, col('workshop_date')),
      ts: parseTs(get(r, tsCol)), tsRaw: get(r, tsCol),
      form: cmp === '2' ? 'Complete' : cmp === '1' ? 'Unverified' : cmp === '0' ? 'Incomplete' : (cmp || '—'),
      dec, am, obs: get(r, col('overall_observations')), rat: get(r, col('country_rationale'))
    });
  });
  // one consolidated position per Member State: keep the most recent submission
  const by = new Map();
  all.forEach(rec => {
    const cur = by.get(rec.state);
    if (!cur){ by.set(rec.state, rec); return; }
    const newer = (rec.ts > cur.ts) || (rec.ts === cur.ts && rec.row > cur.row);
    const keep = newer ? rec : cur, drop = newer ? cur : rec;
    by.set(rec.state, keep);
    let e = rep.dupes.find(d => d.state === rec.state);
    if (!e){ e = { state:rec.state, kept:null, removed:[] }; rep.dupes.push(e); }
    e.kept = keep.id; if (!e.removed.includes(drop.id)) e.removed.push(drop.id);
    e.removed = e.removed.filter(x => x !== keep.id);
  });
  rep.submissions = all.length;
  return { records:[...by.values()].sort((a,b)=>a.state.localeCompare(b.state)), report:rep };
}

/* =====================================================================
   4. Analytics
   ===================================================================== */
function classify(pV){
  if (pV == null) return 'na';
  if (pV >= S.settings.high) return 'high';
  if (pV >= S.settings.sub) return 'mid';
  return 'low';
}
const pc = (n,d) => d ? (100*n/d) : null;

function themesOf(text){
  const t = ' ' + norm(text) + ' ';
  const out = THEMES.filter(th => th.kw.some(k => t.includes(norm(k).length ? (k.endsWith(' ') ? ' '+norm(k)+' ' : norm(k)) : k)));
  return out.map(t=>t.id);
}

const viewRecs = () => S.ui.country ? S.records.filter(r => r.state === S.ui.country) : S.records;
function compute(){
  const R = viewRecs(), N = R.length;
  const items = ITEMS.map(it => {
    const c = { V:0, A:0, N:0 }, who = { V:[], A:[], N:[], M:[] };
    R.forEach(r => { const d = r.dec[it.code]; if (d){ c[d]++; who[d].push(r.state); } else who.M.push(r.state); });
    const n = c.V + c.A + c.N;
    const o = { ...it, ...c, n, missing:N - n, who,
      pV:pc(c.V,n), pA:pc(c.A,n), pN:pc(c.N,n), pC:pc(c.V+c.A,n) };
    o.cls = classify(o.pV);
    o.comments = R.filter(r => (r.dec[it.code] === 'A' || r.dec[it.code] === 'N'))
                  .map(r => ({ state:r.state, dec:r.dec[it.code], text:r.am[it.code] || '', rat:r.rat, item:it.code }));
    return o;
  });
  const agg = list => {
    const t = { V:0, A:0, N:0, missing:0 };
    list.forEach(i => { t.V+=i.V; t.A+=i.A; t.N+=i.N; t.missing+=i.missing; });
    t.n = t.V+t.A+t.N; t.pV=pc(t.V,t.n); t.pA=pc(t.A,t.n); t.pN=pc(t.N,t.n); t.pC=pc(t.V+t.A,t.n);
    return t;
  };
  const sections = {}; Object.keys(SECTIONS).forEach(k => { sections[k] = agg(items.filter(i => i.sec === k)); });
  const overall = agg(items);
  const answered = R.map(r => ITEMS.filter(i => r.dec[i.code]).length);
  const complete = R.filter((r,i) => answered[i] === ITEMS.length);
  const full = complete.filter(r => ITEMS.every(i => r.dec[i.code] === 'V'));
  const incompl = R.map((r,i) => ({ rec:r, answered:answered[i], missing:ITEMS.filter(x => !r.dec[x.code]).map(x=>x.code) }))
                   .filter(x => x.answered < ITEMS.length);
  const decisions = answered.reduce((a,b)=>a+b,0);
  const possible = N * ITEMS.length;
  const requiring = items.filter(i => i.cls === 'mid' || i.cls === 'low');
  const plenary = items.filter(i => i.cls === 'low');
  // amendment comments + themes
  const comments = items.flatMap(i => i.comments);
  comments.forEach(c => { c.themes = c.text ? themesOf(c.text) : []; });
  const themeCount = Object.fromEntries(THEMES.map(t => [t.id, { n:0, items:{}, states:new Set() }]));
  comments.forEach(c => c.themes.forEach(id => {
    themeCount[id].n++; themeCount[id].items[c.item] = (themeCount[id].items[c.item]||0)+1; themeCount[id].states.add(c.state);
  }));
  S.stats = { N, items, sections, overall, complete, full, incompl, decisions, possible, requiring, plenary,
              comments, themeCount, answered,
              participation: S.settings.expected ? 100*N/S.settings.expected : null,
              completeness: pc(decisions, possible),
              fullPct: pc(full.length, complete.length) };
}

/* ----- small chart/markup builders ----- */
function stack(V,A,N, thin=false){
  const t = V+A+N;
  if (!t) return `<div class="stack ${thin?'thin':''}"></div>`;
  const seg = (k,v) => v ? `<span class="s-${k.toLowerCase()}" style="width:${100*v/t}%" ${tip(`${DEC[k].label}: ${v} (${(100*v/t).toFixed(1)}%)`)}>${!thin && 100*v/t >= 9 ? Math.round(100*v/t)+'%' : ''}</span>` : '';
  return `<div class="stack ${thin?'thin':''}">${seg('V',V)}${seg('A',A)}${seg('N',N)}</div>`;
}
const legend = () => `<div class="legend"><span><i class="lg-v"></i>Validated</span><span><i class="lg-a"></i>Validated with amendment</span><span><i class="lg-n"></i>Not validated</span></div>`;

function donut(o){
  const parts = [['V',o.V],['A',o.A],['N',o.N]].filter(p => p[1] > 0);
  const size = 200, th = 28, r = (size - 34)/2, C = 2*Math.PI*r, cx = size/2;
  let off = 0, segs = '';
  parts.forEach(([k,v]) => {
    const len = C * v / o.n, gap = parts.length > 1 ? 2.5 : 0;
    segs += `<circle class="seg-c" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${DEC[k].color}" stroke-width="${th}"
      stroke-dasharray="${Math.max(len-gap,0.1)} ${C-len+gap}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})"
      ${tip(`${DEC[k].label}: ${v} decisions (${(100*v/o.n).toFixed(1)}%)`)}></circle>`;
    off += len;
  });
  return `<div class="donut"><svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Overall decision distribution">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EFEBE8" stroke-width="${th}"></circle>${segs}</svg>
    <div class="mid"><b>${o.n ? fp0(o.pV) : '—'}</b><span>unconditionally validated</span></div></div>`;
}

function rankList(list, key, color, fmt){
  const sorted = [...list].sort((a,b) => (b['p'+key]??-1) - (a['p'+key]??-1) || b[key] - a[key] || a.order - b.order);
  return sorted.map((i,k) => `<button class="rank-row" data-act="item" data-code="${i.code}" ${tip(`${i.code} — ${i.title}`)}>
    <span class="pos">${k+1}</span><span class="sc-code">${i.code}</span>

    <span class="rv">${fp(i['p'+key])}<small>${i[key]} of ${i.n}</small></span></button>`).join('');

function priorityMap(list){
  const W = 560, H = 330, m = { l:46, r:14, t:14, b:42 };
  const maxY = Math.max(10, Math.ceil(Math.max(...list.map(i => i.pN ?? 0), 0)/5)*5 + 5);
  const X = v => m.l + (W-m.l-m.r) * v/100, Y = v => H - m.b - (H-m.t-m.b) * v/maxY;
  const h = S.settings.high, s = S.settings.sub;
  let g = `<rect x="${X(0)}" y="${Y(maxY)}" width="${X(s)-X(0)}" height="${Y(0)-Y(maxY)}" fill="var(--n-t)" opacity=".7"></rect>
           <rect x="${X(s)}" y="${Y(maxY)}" width="${X(h)-X(s)}" height="${Y(0)-Y(maxY)}" fill="var(--a-t)" opacity=".8"></rect>
           <rect x="${X(h)}" y="${Y(maxY)}" width="${X(100)-X(h)}" height="${Y(0)-Y(maxY)}" fill="var(--v-t)" opacity=".9"></rect>`;
  for (let v = 0; v <= 100; v += 20) g += `<text x="${X(v)}" y="${H-m.b+18}" text-anchor="middle" font-size="11" fill="#665C61">${v}%</text>`;
  for (let v = 0; v <= maxY; v += 5) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#fff" stroke-opacity=".9"></line><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#665C61">${v}%</text>`;
  g += `<text x="${(m.l+W-m.r)/2}" y="${H-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#201A1C">Unconditional validation rate →</text>
        <text transform="translate(13 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700" fill="#201A1C">Non-validation rate →</text>
        <text x="${X(s/2)}" y="${m.t+12}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8C0024">FURTHER CONSULTATION</text>
        <text x="${X((s+h)/2)}" y="${m.t+12}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8F7338">REVIEW</text>
        <text x="${X((h+100)/2)}" y="${m.t+12}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#005A38">HIGH</text>`;
  list.forEach(i => {
    if (i.pV == null) return;
    const fill = i.cls === 'high' ? 'var(--v)' : i.cls === 'mid' ? 'var(--a)' : 'var(--n)';
    const r = 9 + Math.min(i.A, 20)*0.35;
    g += `<g class="pt" data-act="item" data-code="${i.code}" tabindex="0" ${tip(`${i.code} — ${i.title}\nUnconditional ${fp(i.pV)} · Not validated ${fp(i.pN)} · Amendments ${i.A}`)}>
      <circle cx="${X(i.pV)}" cy="${Y(i.pN)}" r="${r}" fill="${fill}" fill-opacity=".92" stroke="#fff" stroke-width="1.5"></circle>
      <text x="${X(i.pV)}" y="${Y(i.pN)+3.5}" text-anchor="middle" font-size="9.5" font-weight="800" fill="${i.cls==='mid'?'#201A1C':'#fff'}" pointer-events="none">${i.code}</text></g>`;
  });
  return `<svg class="scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resolution priority map">${g}</svg>`;
}

function viewExec(){
  const st = S.stats, o = st.overall, list = visItems();
  const kpis = `<div class="grid g5">
    ${S.ui.country ? kpi('Selected Member State', '1', `${esc(S.ui.country)} · ${esc(S.records.find(r=>r.state===S.ui.country)?.form||'')}`, 'var(--maroon)') : kpi('Responding Member States<span class="q">Q1</span>', st.N, `of ${S.settings.expected} expected · <b>${fp(st.participation)}</b> participation`, 'var(--maroon)', st.participation)}
    ${kpi('Response completeness<span class="q">Q15</span>', fp(st.completeness), `${st.decisions} of ${st.possible} item decisions recorded · ${st.incompl.length} submission${st.incompl.length===1?'':'s'} with unanswered items`, 'var(--gold-d)', st.completeness)}
    ${kpi('Full-document endorsement<span class="q">Q14</span>', st.full.length, `of ${st.complete.length} complete responses (<b>${fp(st.fullPct)}</b>) validated all 17 items without amendment`, 'var(--green)', st.fullPct)}
    ${kpi('Provisions requiring resolution', `${st.requiring.length}<small> / 17</small>`, `${st.plenary.length} further consultation / plenary · ${st.requiring.length - st.plenary.length} technical review`, 'var(--maroon)', 100*st.requiring.length/17)}
    ${kpi('Combined support rate', fp(o.pC), `Validated + with amendment · unconditional ${fp(o.pV)} reported separately`, 'var(--green)', o.pC)}
  </div>`;

  const dist = `<div class="card"><div class="card-h"><div><h2>Overall decision distribution<span class="q">Q5</span></h2>
      <p class="desc">Share of all recorded item decisions (${o.n}), missing responses excluded.</p></div></div>
      <div class="donut-wrap">${donut(o)}<ul class="dl">
        ${['V','A','N'].map(k => `<li><i style="background:${DEC[k].color}"></i><span class="nm">${DEC[k].label}<span class="ct">${o[k]} decisions</span></span><span class="vl">${fp(o['p'+k])}</span></li>`).join('')}
      </ul></div>

  const secs = `<div class="card"><h2>Validation distribution by section<span class="q">Q6</span></h2>
      <p class="desc">Decisions per section, missing responses excluded.</p>
      ${Object.keys(SECTIONS).map(k => { const s = st.sections[k]; return `<div class="sec-row"><div class="sr-h"><span>${SECTIONS[k].name} <small style="color:var(--muted);font-weight:600">(${SECTIONS[k].range})</small></span><span>${s.n} decisions · ${s.missing} missing</span></div>${stack(s.V,s.A,s.N)}</div>`; }).join('')}
      <div class="sec-row"><div class="sr-h"><span>Whole framework <small style="color:var(--muted);font-weight:600">(17 items)</small></span><span>${o.n} decisions</span></div>${stack(o.V,o.A,o.N)}</div>
      ${legend()}</div>`;

  const mgmt = `<div class="card"><h2>Strategic management indicators</h2><p class="desc">Overall and by section — share of recorded decisions.</p>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Indicator</th><th>Overall</th><th>Pillars</th><th>Domains</th><th>Continental</th><th>Management interpretation</th></tr></thead><tbody>
    ${[['Unconditional consensus rate','pV','Share validating without amendment','pc-v'],
       ['Conditional support rate','pA','Share validating with amendment','pc-a'],
       ['Combined support rate','pC','Share selecting either validation category',''],
       ['Non-validation rate','pN','Share rejecting the item in its current form','pc-n']]
      .map(([n,k,t,c]) => `<tr><td><b>${n}</b></td><td class="num ${c}">${fp(o[k])}</td>${Object.keys(SECTIONS).map(s => `<td class="num ${c}">${fp(st.sections[s][k])}</td>`).join('')}<td>${t}</td></tr>`).join('')}
    <tr><td><b>Resolution priority</b></td><td class="num"><b>${st.requiring.length}</b> / 17</td>
      ${Object.keys(SECTIONS).map(s => { const L = st.items.filter(i=>i.sec===s); const n = L.filter(i=>i.cls==='mid'||i.cls==='low').length; return `<td class="num"><b>${n}</b> / ${L.length}</td>`; }).join('')}
      <td>Items requiring technical or plenary attention (unconditional rate below ${S.settings.high}%)</td></tr>
    </tbody></table></div></div>`;

  const sc = `<div class="card"><div class="card-h"><div><h2>Consensus scorecard<span class="q">Q10</span></h2>
      <p class="desc">Unconditional validation rate against the suggested thresholds — ${esc(secLabel())}.</p></div></div>
      ${scorecardRows(list)}
      <div class="note">Thresholds (subject to approval): <b>${S.settings.high}–100%</b> high consensus · <b>${S.settings.sub}–${S.settings.high-1}%</b> substantial support, review amendments · <b>below ${S.settings.sub}%</b> further consultation or plenary discussion. Adjustable in Data &amp; Settings.</div></div>`;

  const map = `<div class="card"><h2>Resolution priority map</h2>
      <p class="desc">Each bubble is a provision; bigger = more amendment requests. Click a bubble for details.</p>${priorityMap(list)}</div>`;

  const lists = `<div class="grid g3">
    <div class="card"><h2>Highest unconditional validation<span class="q">Q7</span></h2><p class="desc">Top 5 · ${esc(secLabel())}</p>${rankList([...list].sort((a,b)=>(b.pV??-1)-(a.pV??-1)).slice(0,5),'V','var(--green)')}</div>
    <div class="card"><h2>Most amendment requests<span class="q">Q8</span></h2><p class="desc">Top 5 · ${esc(secLabel())}</p>${rankList([...list].sort((a,b)=>(b.pA??-1)-(a.pA??-1)).slice(0,5),'A','var(--gold)')}</div>
    <div class="card"><h2>Highest non-validation<span class="q">Q9</span></h2><p class="desc">Priority review list · top 5 · ${esc(secLabel())}</p>${rankList([...list].sort((a,b)=>(b.pN??-1)-(a.pN??-1)).slice(0,5),'N','var(--maroon)')}</div>
  </div>`;

  return filterBar() + kpis + `<div class="grid g-12">${dist}${secs}</div>` + matrixCard() + `<div class="grid g-21">${sc}${map}</div>` + `<div class="grid" style="grid-template-columns:minmax(0,1fr)">${mgmt}</div>` + lists;
}

/* ---------- Provision matrix ---------- */
function matrixCard(){
  const st = S.stats, list = visItems();
  const key = S.ui.sortKey, dir = S.ui.sortDir;
  const val = i => key === 'order' ? i.order : key === 'title' ? i.title : key === 'missing' ? i.missing : (i['p'+key] ?? -1);
  const sorted = [...list].sort((a,b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir || a.order - b.order; });
  const th = (k,l) => `<th class="sortable" data-act="sort" data-k="${k}" aria-sort="${key===k?(dir>0?'ascending':'descending'):'none'}">${l}${key===k?` <span class="ar">${dir>0?'▲':'▼'}</span>`:''}</th>`;
  const cell = (n,p,c) => `<td class="num"><span class="${c}">${n}</span><small>(${fp(p)})</small></td>`;
  const row = i => `<tr class="row-i" data-act="item" data-code="${i.code}" tabindex="0">
    <td><span class="codepill">${i.code}</span></td><td><b>${esc(i.title)}</b></td>
    ${cell(i.V,i.pV,'pc-v')}${cell(i.A,i.pA,'pc-a')}${cell(i.N,i.pN,'pc-n')}
    <td class="num">${i.missing}</td><td style="min-width:130px">${stack(i.V,i.A,i.N,true)}</td>
    <td class="num"><b>${fp(i.pC)}</b></td><td><span class="badge ${CLS[i.cls].b}">${CLS[i.cls].badge}</span></td></tr>`;
  const tot = (label, t, cls='sub') => `<tr class="${cls}"><td colspan="2">${label}</td>
    <td class="num">${t.V}<small>(${fp(t.pV)})</small></td><td class="num">${t.A}<small>(${fp(t.pA)})</small></td><td class="num">${t.N}<small>(${fp(t.pN)})</small></td>
    <td class="num">${t.missing}</td><td>${stack(t.V,t.A,t.N,true)}</td><td class="num">${fp(t.pC)}</td><td></td></tr>`;
  let body = '';
  if (key === 'order'){
    Object.keys(SECTIONS).forEach(k => {
      if (secFilter() !== 'ALL' && secFilter() !== k) return;
      const rows = sorted.filter(i => i.sec === k); if (!rows.length) return;
      body += `<tr class="sub"><td colspan="9">${SECTIONS[k].name.toUpperCase()} (${SECTIONS[k].range})</td></tr>` + rows.map(row).join('') + tot('Section total', st.sections[k]);
    });
  } else body = sorted.map(row).join('');
  if (secFilter() === 'ALL') body += tot('ALL 17 PROVISIONS', st.overall, 'tot');
  return `<div class="card" style="margin-bottom:16px"><h2>Provision-by-provision validation matrix<span class="q">Q2–Q4</span></h2>
    <p class="desc">Count (and % of recorded decisions) per response category — ${esc(secLabel())}. Percentages exclude missing responses. Click a row for Member State detail; click a header to sort.</p>
    <div class="tbl-wrap"><table class="t"><thead><tr>${th('order','Code')}${th('title','Provision')}${th('V','Validated n (%)')}${th('A','With amendment n (%)')}${th('N','Not validated n (%)')}${th('missing','Missing n')}<th>Distribution</th>${th('C','Combined support')}<th>Consensus</th></tr></thead>
    <tbody>${body}</tbody></table></div>${legend()}</div>`;
}
function viewMatrix(){
  const list = visItems();
  const rk = S.ui.rank, rkInfo = { V:['Highest unconditional validation','Q7','var(--green)','V'], A:['Most amendment requests','Q8','var(--gold)','A'], N:['Highest non-validation — priority review list','Q9','var(--maroon)','N'] }[rk];
  const rl = [...list].filter(i => rk !== 'N' || i.N > 0);
  const rseg = (k,l) => `<button data-act="rank" data-v="${k}" aria-pressed="${rk===k}">${l}</button>`;

  return filterBar() + matrixCard() + `
    <div class="card"><div class="card-h"><div><h2>${rkInfo[0]}<span class="q">${rkInfo[1]}</span></h2><p class="desc">Ranked — ${esc(secLabel())}${rk==='N'?' · only provisions with at least one non-validation':''}.</p></div>
      <div class="seg" role="group" aria-label="Ranking metric">${rseg('V','Unconditional')}${rseg('A','Amendments')}${rseg('N','Non-validation')}</div></div>
    ${rl.length ? rankList(rl, rkInfo[3], rkInfo[2]) : '<div class="empty">No provision has a non-validation in the current data.</div>'}</div>`;
}

/* ---------- Member States ---------- */
function hmRows(){
  const st = S.stats, list = visItems(), q = norm(S.ui.hmQ);
  let rs = viewRecs().map((r,i) => {
    const c = { V:0, A:0, N:0, M:0 };
    ITEMS.forEach(it => { const d = r.dec[it.code]; c[d || 'M']++; });
    return { r, c };
  });
  if (q) rs = rs.filter(x => norm(x.r.state).includes(q));
  if (S.ui.hmIssues) rs = rs.filter(x => x.c.A + x.c.N + x.c.M > 0);
  const sorts = {
    name:(a,b)=>a.r.state.localeCompare(b.r.state),
    issues:(a,b)=>(b.c.N-a.c.N)||(b.c.A-a.c.A)||a.r.state.localeCompare(b.r.state),
    support:(a,b)=>(b.c.V-a.c.V)||a.r.state.localeCompare(b.r.state)
  };
  rs.sort(sorts[S.ui.hmSort] || sorts.name);
  return rs.map(({r,c}) => `<tr><td class="stn"><button data-act="state" data-s="${esc(r.state)}">${esc(r.state)}</button></td>
    ${list.map(i => { const d = r.dec[i.code]; return `<td><button class="cell c-${d||'M'}" data-act="cell" data-code="${i.code}" ${tip(`${r.state}\n${i.code} — ${i.title}\n${d ? DEC[d].label : 'No response'}`)} aria-label="${esc(r.state)} ${i.code} ${d ? DEC[d].label : 'no response'}">${d ? DEC[d].glyph : '·'}</button></td>`; }).join('')}
    <td class="sum">${c.V}✓ ${c.A}± ${c.N}✕${c.M?` ${c.M}·`:''}</td></tr>`).join('') ||
    `<tr><td colspan="${list.length+2}" class="empty">No Member State matches the current filter.</td></tr>`;
}
function viewStates(){
  const st = S.stats, list = visItems();
  const hseg = (k,l) => `<button data-act="hmSort" data-v="${k}" aria-pressed="${S.ui.hmSort===k}">${l}</button>`;
  const strip = `<div class="grid g3">
    ${kpi('Member States responding', st.N, `${S.report?.submissions ?? st.N} submissions received${S.report?.dupes.length ? ` · ${S.report.dupes.length} duplicate${S.report.dupes.length>1?'s':''} resolved` : ''}`, 'var(--maroon)')}
    ${kpi('Validated all 17 without amendment', st.full.length, `${fp(st.fullPct)} of ${st.complete.length} complete responses`, 'var(--green)', st.fullPct)}
    ${kpi('Submissions with unanswered items', st.incompl.length, `${fp(100 - (st.completeness ?? 100))} of expected item decisions missing`, 'var(--gold-d)')}
  </div>`;
  const fullCard = `<div class="card" style="margin-bottom:16px"><h2>Full endorsement without amendment<span class="q">Q14</span></h2>
    <p class="desc">Member States that selected “Validated” for all 17 items (complete responses only).</p>
    ${st.full.length ? `<div class="chips">${st.full.map(r => `<button class="pill v" data-act="state" data-s="${esc(r.state)}">✓ ${esc(r.state)}</button>`).join('')}</div>` : '<div class="empty">No Member State has validated all 17 items without amendment yet.</div>'}</div>`;
  const hm = `<div class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Country-by-provision matrix<span class="q">Q11</span></h2>
    <p class="desc">Who requested amendments (±) or did not validate (✕) each provision — ${esc(secLabel())}. Click a cell for the provision detail, a name for the Member State profile.</p></div></div>
    <div class="toolbar"><input class="search" id="hmQ" placeholder="Search Member State…" value="${esc(S.ui.hmQ)}" aria-label="Search Member State" data-in="hmQ">
      <div class="seg" role="group" aria-label="Sort">${hseg('name','A–Z')}${hseg('issues','Most concerns')}${hseg('support','Most validated')}</div>
      <label class="pill" style="cursor:pointer"><input type="checkbox" data-in="hmIssues" ${S.ui.hmIssues?'checked':''}> Only with amendments / gaps</label></div>
    <div class="hm-wrap"><table class="hm"><thead><tr><th class="stn">Member State</th>${list.map(i => `<th ${tip(i.title)}>${i.code}</th>`).join('')}<th></th></tr></thead><tbody id="hmBody">${hmRows()}</tbody></table></div>
    <div class="legend"><span><i class="lg-v"></i>✓ Validated</span><span><i class="lg-a"></i>± With amendment</span><span><i class="lg-n"></i>✕ Not validated</span><span><i class="lg-m"></i>· No response</span></div></div>`;
  const comp = `<div class="card"><h2>Completeness report<span class="q">Q15</span></h2>
    <p class="desc">Submissions that contain unanswered items. Missing responses are reported here and excluded from all percentage denominators.</p>
    ${st.incompl.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Member State</th><th>Answered</th><th>Unanswered items</th><th>REDCap form status</th><th>Submitted</th></tr></thead><tbody>
      ${st.incompl.map(x => `<tr class="row-i" data-act="state" data-s="${esc(x.rec.state)}" tabindex="0"><td><b>${esc(x.rec.state)}</b></td><td class="num">${x.answered} / 17</td>
        <td><div class="chips">${x.missing.map(c => `<span class="pill m">${c}</span>`).join('')}</div></td><td>${esc(x.rec.form)}</td><td class="num">${esc(x.rec.tsRaw || '—')}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">All submissions answered all 17 items.</div>'}</div>`;
  return strip + fullCard + hm + comp;
}

/* ---------- Amendments & themes ---------- */
function filteredComments(){
  const st = S.stats, vis = new Set(visItems().map(i=>i.code));
  const q = norm(S.ui.amQ);
  return st.comments.filter(c => vis.has(c.item)
    && (S.ui.amItem === 'ALL' || c.item === S.ui.amItem)
    && (S.ui.amDec === 'ALL' || c.dec === S.ui.amDec)
    && (S.ui.amTheme === 'ALL' || c.themes.includes(S.ui.amTheme))
    && (!q || norm(c.text + ' ' + c.state).includes(q)))
    .sort((a,b) => ITEM[a.item].order - ITEM[b.item].order || a.state.localeCompare(b.state));
}
function commentCards(list){
  return list.length ? list.map(c => `<div class="cm ${c.dec==='N'?'n':''}"><div class="cm-h">
      <button class="pill" data-act="item" data-code="${c.item}"><b>${c.item}</b> ${esc(ITEM[c.item].title)}</button>
      <button class="pill" data-act="state" data-s="${esc(c.state)}">${esc(c.state)}</button>${decBadge(c.dec)}</div>
      <p>${c.text ? esc(c.text) : '<i style="color:var(--muted)">No amendment text provided.</i>'}</p>
      ${c.themes.length ? `<div class="tags">${c.themes.map(t => `<span class="tg">${THEMES.find(x=>x.id===t).label}</span>`).join('')}</div>` : ''}</div>`).join('')
    : '<div class="empty">No amendment comments match the current filters.</div>';
}
function viewAmend(){
  const st = S.stats, vis = new Set(visItems().map(i=>i.code));
  const cs = st.comments.filter(c => vis.has(c.item));
  const tc = THEMES.map(t => ({ t, n:cs.filter(c => c.themes.includes(t.id)).length })).sort((a,b)=>b.n-a.n);
  const max = Math.max(1, ...tc.map(x=>x.n));
  const unclassified = cs.filter(c => c.text && !c.themes.length).length, noText = cs.filter(c => !c.text).length;
  const list = filteredComments();
  const opt = (v,l,cur) => `<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  return filterBar() + `<div class="grid g-12">
    <div class="card"><h2>Recurring amendment themes<span class="q">Q12</span></h2>
      <p class="desc">${cs.length} amendment / non-validation comments · ${esc(secLabel())}. Click a theme to filter the comments.</p>
      ${tc.map(({t,n}) => `<button class="theme-row" data-act="theme" data-v="${t.id}" aria-pressed="${S.ui.amTheme===t.id}"><span style="font-weight:600">${t.label}</span><span class="tb"><i style="width:${100*n/max}%"></i></span><b>${n}</b></button>`).join('')}
      <div class="note">Themes are tagged automatically from keywords (English &amp; French) and a comment can belong to several themes. ${unclassified} comment${unclassified===1?'':'s'} matched no theme${noText ? `; ${noText} decision${noText===1?'':'s'} had no text` : ''}. Treat as a screening aid and review the wording below.</div></div>
    <div class="card"><h2>Comments by provision</h2><p class="desc">Where amendment comments concentrate.</p>
      ${visItems().map(i => ({ i, n:i.comments.length })).sort((a,b)=>b.n-a.n || a.i.order-b.i.order).map(({i,n}) => `<button class="rank-row" style="grid-template-columns:34px minmax(0,1fr) 40px" data-act="item" data-code="${i.code}"><span class="sc-code">${i.code}</span><span><span class="rank-t">${esc(i.title)}</span><span class="rb" style="display:block"><i style="width:${100*n/Math.max(1,...visItems().map(x=>x.comments.length))}%;background:var(--gold)"></i></span></span><span class="rv">${n}</span></button>`).join('')}
    </div></div>
    <div class="card"><h2>Amendment comments</h2><p class="desc">Showing <b>${list.length}</b> of ${cs.length}.</p>
      <div class="toolbar"><input class="search" data-in="amQ" id="amQ" placeholder="Search text or Member State…" value="${esc(S.ui.amQ)}" aria-label="Search comments">
        <select class="search" data-in="amItem" aria-label="Provision"><option value="ALL">All provisions</option>${visItems().map(i => opt(i.code, `${i.code} — ${esc(i.title)}`, S.ui.amItem)).join('')}</select>
        <select class="search" data-in="amDec" aria-label="Decision">${opt('ALL','Amended + not validated',S.ui.amDec)}${opt('A','With amendment',S.ui.amDec)}${opt('N','Not validated',S.ui.amDec)}</select>
        <select class="search" data-in="amTheme" aria-label="Theme">${opt('ALL','All themes',S.ui.amTheme)}${THEMES.map(t => opt(t.id,t.label,S.ui.amTheme)).join('')}</select>
        <button class="btn sec sm" data-act="amReset">Reset filters</button></div>
      <div id="amList">${commentCards(list)}</div></div>`;
}

/* ---------- Resolution register ---------- */
const REG_STATUS = ['Open','Technical review','Referred to plenary','Resolved','No action required'];
function regRows(){
  let list = visItems();
  if (S.ui.regPlenary) list = list.filter(i => i.cls === 'low' || i.cls === 'mid' || i.N > 0);
  return list.map(i => {
    const reg = S.register[i.code] || {};
    const amenders = i.comments.map(c => c.state);
    const rats = i.comments.filter(c => c.rat).map(c => `<div><b>${esc(c.state)}:</b> ${esc(c.rat)}</div>`);
    const texts = i.comments.filter(c => c.text).map(c => `<div><b>${esc(c.state)} <span style="color:${c.dec==='N'?'var(--maroon)':'var(--gold-d)'}">(${DEC[c.dec].short})</span>:</b> ${esc(c.text)}</div>`);
    return `<tr><td><span class="codepill">${i.code}</span></td>
      <td style="min-width:200px"><b>${esc(i.title)}</b><div style="margin-top:4px"><span class="badge ${CLS[i.cls].b}">${CLS[i.cls].badge}</span> <small class="num">${fp(i.pV)} unconditional</small></div></td>
      <td style="min-width:240px">${texts.length ? `<details class="dt"><summary>${texts.length} proposed amendment${texts.length>1?'s':''}</summary><div class="dt-b">${texts.join('')}</div></details>` : '<span style="color:var(--muted)">None recorded</span>'}
        ${rats.length ? `<details class="dt" style="margin-top:6px"><summary>Rationale / country-specific considerations (${rats.length})</summary><div class="dt-b">${rats.join('')}</div></details>` : ''}</td>
      <td style="min-width:180px"><div class="chips">${amenders.length ? amenders.map(s => `<button class="pill ${i.comments.find(c=>c.state===s).dec==='N'?'n':'a'}" data-act="state" data-s="${esc(s)}">${esc(s)}</button>`).join('') : '<span style="color:var(--muted)">—</span>'}</div></td>
      <td style="min-width:150px"><input class="reg-in" data-reg="${i.code}" data-f="owner" placeholder="Owner" value="${esc(reg.owner||'')}" aria-label="Owner for ${i.code}"></td>
      <td class="reg-st" style="min-width:160px"><select data-reg="${i.code}" data-f="status" aria-label="Resolution status for ${i.code}">${REG_STATUS.map(s => `<option ${((reg.status || (i.cls==='low'?'Referred to plenary':'Open'))===s)?'selected':''}>${s}</option>`).join('')}</select></td>
      <td style="min-width:200px"><input class="reg-in" data-reg="${i.code}" data-f="final" placeholder="Final decision" value="${esc(reg.final||'')}" aria-label="Final decision for ${i.code}"></td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">No provision matches the filter.</td></tr>';
}

    <div class="grid g-21">

function render(keepScroll){
  const y = window.scrollY;
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${S.ui.tab===k}">${l}${k==='amend'?`<span class="cnt">${S.stats.comments.length}</span>`:''}${k==='states'?`<span class="cnt">${S.stats.N}</span>`:''}</button>`).join('');
  $('#view').innerHTML = (VIEWS[S.ui.tab] || viewExec)();

  const srcTxt = m.source === 'import' ? `Imported: ${m.name || 'file'}` : m.source === 'repo' ? 'Shared REDCap export' : 'Sample data';
  $('#srcTxt').textContent = srcTxt;
  $('#srcChip').classList.toggle('live', m.source !== 'sample');

    if (k === 'V') return i.who.V.length ? `<h4>${label} (${i.who.V.length})</h4><div class="chips">${i.who.V.map(s => `<button class="pill v" data-act="state" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : '';
    return cs.length ? `<h4>${label} (${cs.length})</h4>${cs.map(c => `<div class="cm ${k==='N'?'n':''}"><div class="cm-h"><button class="pill" data-act="state" data-s="${esc(c.state)}"><b>${esc(c.state)}</b></button></div><p>${c.text ? esc(c.text) : '<i style="color:var(--muted)">No amendment text provided.</i>'}</p>${c.rat ? `<p style="margin-top:6px;color:var(--muted);font-size:12.5px"><b>Rationale / country considerations:</b> ${esc(c.rat)}</p>` : ''}</div>`).join('')}` : '';

    ${stack(i.V,i.A,i.N)}<div class="note">Combined support <b>${fp(i.pC)}</b> · unconditional <b>${fp(i.pV)}</b> · based on ${i.n} recorded decision${i.n===1?'':'s'}.</div>

}

let lastFocus = null;
function openDrawer(html){
  const d = $('#drawer'); lastFocus = document.activeElement;
  d.innerHTML = html; d.classList.add('on'); $('#ov').classList.add('on'); d.setAttribute('aria-hidden','false');
  d.querySelector('.dr-b').scrollTop = 0; const x = d.querySelector('.x'); if (x) x.focus();
}
function closeDrawer(){
  $('#drawer').classList.remove('on'); $('#ov').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true');
  if (lastFocus && document.contains(lastFocus)) try { lastFocus.focus(); } catch(e){}
}

/* =====================================================================
   8. Data loading
   ===================================================================== */
function applyCSV(text, meta){
  const built = buildRecords(parseCSV(text));
  S.records = built.records; S.report = built.report;
  S.meta = Object.assign({ at:Date.now() }, meta);
  if (S.ui.country && !S.records.some(r => r.state === S.ui.country)) S.ui.country = '';
  compute();
}
async function init(){
  let loaded = false;
  const stored = jget(K.data, null);
  if (stored && stored.csv){
    try { applyCSV(stored.csv, stored.meta || { source:'import', name:'imported file' }); loaded = true; }
    catch(e){ LS.del(K.data); }
  }
  if (!loaded){
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 4000);
      const res = await fetch('redcap_export.csv', { cache:'no-store', signal:ctl.signal }); clearTimeout(to);
      if (res.ok){ const t = await res.text(); if (t.trim().length > 20){ applyCSV(t, { source:'repo', name:'redcap_export.csv' }); loaded = true; } }
    } catch(e){}
  }
  if (!loaded) applyCSV(SAMPLE_CSV, { source:'sample', name:'sample_redcap_export.csv' });
  render();
}
function importText(text, name){
  try {
    applyCSV(text, { source:'import', name });
    const ok = LS.set(K.data, JSON.stringify({ csv:text, meta:S.meta }));
    S.ui.tab = S.ui.tab === 'data' ? 'data' : S.ui.tab; render();
    toast(`Imported ${S.report.rowsRead} row${S.report.rowsRead===1?'':'s'} → ${S.stats.N} Member States.` + (S.report.dupes.length ? ` ${S.report.dupes.length} duplicate(s) resolved.` : ''));
    if (!ok) toast('This browser blocked storage, so the data will be lost on refresh. Re-import after reloading.', 'warn');
  } catch(err){ toast(err.message || 'Could not read that file.', 'error'); }
}
function importFile(f){
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => importText(String(rd.result), f.name);
  rd.onerror = () => toast('Could not read the file.', 'error');
  rd.readAsText(f, 'utf-8');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a){
    case 'tab': S.ui.tab = v; saveUI(); render(); window.scrollTo(0,0); break;
    case 'clearCountry': S.ui.country=''; saveUI(); compute(); render(true); break;
    case 'section': S.ui.section = v; saveUI(); render(true); break;
    case 'item': itemDrawer(t.dataset.code); break;
    case 'cell': itemDrawer(t.dataset.code); break;
    case 'state': stateDrawer(t.dataset.s); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'sort': { const k = t.dataset.k; if (S.ui.sortKey === k) S.ui.sortDir *= -1; else { S.ui.sortKey = k; S.ui.sortDir = k === 'order' || k === 'title' ? 1 : -1; } render(true); break; }
    case 'rank': S.ui.rank = v; render(true); break;
    case 'hmSort': S.ui.hmSort = v; render(true); break;
    case 'theme': S.ui.amTheme = S.ui.amTheme === v ? 'ALL' : v; render(true); break;
    case 'amReset': Object.assign(S.ui, { amItem:'ALL', amDec:'ALL', amTheme:'ALL', amQ:'' }); render(true); break;
    case 'pick': $('#file').value = ''; $('#file').click(); break;
    case 'loadSample': importSampleLocal(); break;
    case 'dlSample': download('sample_redcap_export.csv', SAMPLE_CSV); break;
    case 'clearData': confirmDlg('Remove imported data?', 'This deletes the data stored in this browser and returns the dashboard to the shared/sample dataset. Your REDCap data is not affected.', 'Remove', () => { LS.del(K.data); init(); toast('Imported data removed.'); }); break;
    case 'clearReg': confirmDlg('Clear register edits?', 'Owner, resolution status and final decision entries saved in this browser will be erased.', 'Clear', () => { S.register = {}; LS.del(K.register); render(true); toast('Register edits cleared.'); }); break;
    case 'dlgYes': { const d = $('#dlg'); const f = d._ok; d.close(); f && f(); break; }
    case 'dlgNo': $('#dlg').close(); break;
    case 'dlRegister': exportRegister(); break;
  }
});
function importSampleLocal(){
  LS.del(K.data); applyCSV(SAMPLE_CSV, { source:'sample', name:'sample_redcap_export.csv' }); render(true); toast('Sample data loaded.');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#drawer').classList.contains('on')) closeDrawer(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act], g[data-act]')){ e.preventDefault(); e.target.click(); }
});
$('#file').addEventListener('change', e => importFile(e.target.files[0]));
document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); const d = $('#drop'); d && d.classList.add('on'); } });
document.addEventListener('dragleave', e => { if (!e.relatedTarget){ const d = $('#drop'); d && d.classList.remove('on'); } });
document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length){ e.preventDefault(); const d = $('#drop'); d && d.classList.remove('on'); importFile(e.dataTransfer.files[0]); } });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.reg){
    const c = t.dataset.reg; S.register[c] = Object.assign(S.register[c] || {}, { [t.dataset.f]: t.value }); saveRegister(); return;
  }
  const k = t.dataset.in; if (!k) return;
  if (t.type === 'checkbox') return;
  S.ui[k] = t.value;
  if (k === 'hmQ') $('#hmBody').innerHTML = hmRows();
  if (k === 'amQ') $('#amList').innerHTML = commentCards(filteredComments());
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.reg){ const c = t.dataset.reg; S.register[c] = Object.assign(S.register[c] || {}, { [t.dataset.f]: t.value }); saveRegister(); return; }
  if (t.dataset.set){
    let v = Math.round(+t.value); if (!isFinite(v) || v < 1) v = 1;
    S.settings[t.dataset.set] = v;
    if (S.settings.sub >= S.settings.high){ S.settings.sub = Math.max(1, S.settings.high - 1); }
    saveSettings(); compute(); render(true); return;
  }
  const k = t.dataset.in; if (!k) return;
  if (t.type === 'checkbox') S.ui[k] = t.checked; else S.ui[k] = t.value;
  if (k === 'country'){ saveUI(); compute(); }
  render(true);
});

function exportRegister(){
  const rows = [['Code','Provision','Consensus band','Unconditional validation %','Member States (amendment / not validated)','Proposed wording','Rationale / country-specific considerations','Owner','Resolution status','Final decision']];
  S.stats.items.forEach(i => {
    const reg = S.register[i.code] || {};
    rows.push([i.code, i.title, CLS[i.cls].label, i.pV == null ? '' : i.pV.toFixed(1),
      i.comments.map(c => `${c.state} (${DEC[c.dec].short})`).join('; '),
      i.comments.filter(c => c.text).map(c => `${c.state}: ${c.text}`).join(' || '),
      i.comments.filter(c => c.rat).map(c => `${c.state}: ${c.rat}`).join(' || '),
      reg.owner || '', reg.status || (i.cls === 'low' ? 'Referred to plenary' : 'Open'), reg.final || '']);
  });
  download('achdgf_resolution_register.csv', csvOut(rows));
}

/* tooltip */
const tipEl = $('#tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]'); if (!t){ tipEl.classList.remove('on'); return; }
  tipEl.textContent = t.dataset.tip; tipEl.classList.add('on');
});
document.addEventListener('mousemove', e => {
  if (!tipEl.classList.contains('on')) return;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});
document.addEventListener('scroll', () => tipEl.classList.remove('on'), true);

init();
})();
</script>
